<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/math-catchup-web/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" crossorigin href="/math-catchup-web/assets/index-hoHp4g5_.css" />
    <title>Math Catch-Up</title>
  </head>
  <body>
    <div id="root">Loading…</div>
    <script type="module">
      async function loadJoined(url) {
        const t = await fetch(url).then((r) => {
          if (!r.ok) throw new Error('Failed ' + url);
          return r.text();
        });
        return t.replace(/\n/g, '');
      }
      const parts = await Promise.all(
        [0, 1, 2, 3].map((i) =>
          loadJoined(`/math-catchup-web/assets/app.part${i}.js`),
        ),
      );
      const url = URL.createObjectURL(
        new Blob([parts.join('')], { type: 'text/javascript' }),
      );
      await import(url);
    </script>
  </body>
</html>
