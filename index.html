<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/math-catchup-web/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" crossorigin href="/math-catchup-web/assets/index-hoHp4g5_.css" />
    <title>Math Catch-Up</title>
  </head>
  <body>
    <div id="root">Loading…</div>
    <script type="module">
      function b64ToUint8(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }
      const n = 52;
      const parts = await Promise.all(
        Array.from({ length: n }, (_, i) =>
          fetch(`/math-catchup-web/assets/b64/b${String(i).padStart(2, '0')}.txt`).then((r) => {
            if (!r.ok) throw new Error('Failed b64 chunk ' + i);
            return r.text();
          }),
        ),
      );
      const bytes = b64ToUint8(parts.join(''));
      const url = URL.createObjectURL(new Blob([bytes], { type: 'text/javascript' }));
      await import(url);
    </script>
  </body>
</html>
